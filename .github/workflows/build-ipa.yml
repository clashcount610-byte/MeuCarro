name: Build IPA

on:
  workflow_dispatch:
    inputs:
      signing:
        description: Tipo de assinatura
        type: choice
        default: none
        options:
          - none
          - manual
      export_method:
        description: Método de exportação (apenas com assinatura manual)
        type: choice
        default: development
        options:
          - development
          - ad-hoc
          - app-store-connect
      configuration:
        description: Configuração de build
        type: choice
        default: Release
        options:
          - Release
          - Debug
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build e empacotamento do IPA
    runs-on: macos-15

    env:
      BUNDLE_ID: com.meucarro.app
      KEYCHAIN_PASSWORD: runner-keychain-temp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versões do Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Instalar certificado e perfil de provisionamento
        if: ${{ inputs.signing == 'manual' }}
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "::error::Secrets IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD e IOS_PROVISIONING_PROFILE não configurados."
            exit 1
          fi

          echo -n "$IOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$IOS_PROVISIONING_PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/MeuCarro.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # ---------------- Assinatura manual ----------------

      - name: Archive com assinatura
        if: ${{ inputs.signing == 'manual' }}
        env:
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project MeuCarro.xcodeproj \
            -scheme MeuCarro \
            -configuration "${{ inputs.configuration || 'Release' }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MeuCarro.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: Criar ExportOptions.plist
        if: ${{ inputs.signing == 'manual' }}
        env:
          EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: Exportar IPA assinado
        if: ${{ inputs.signing == 'manual' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MeuCarro.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates
          mkdir -p "$GITHUB_WORKSPACE/ipa-output"
          cp "$RUNNER_TEMP"/ipa/*.ipa "$GITHUB_WORKSPACE/ipa-output/"

      # ---------------- Sem assinatura ----------------

      - name: Archive sem assinatura
        if: ${{ inputs.signing != 'manual' }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project MeuCarro.xcodeproj \
            -scheme MeuCarro \
            -configuration "${{ inputs.configuration || 'Release' }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MeuCarro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="${{ env.BUNDLE_ID }}"

      - name: Empacotar IPA sem assinatura
        if: ${{ inputs.signing != 'manual' }}
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/MeuCarro.xcarchive" -name "*.app" -maxdepth 4 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App não encontrado no archive"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "MeuCarro-unsigned.ipa" Payload/
          ls -la
          mkdir -p "$GITHUB_WORKSPACE/ipa-output"
          cp "$RUNNER_TEMP"/ipa/*.ipa "$GITHUB_WORKSPACE/ipa-output/"

      # ---------------- Resultado ----------------

      - name: Listar artefatos
        run: |
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload do IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeuCarro-${{ inputs.configuration || 'Release' }}-${{ inputs.signing || 'none' }}
          path: ipa-output/*.ipa
          if-no-files-found: error
